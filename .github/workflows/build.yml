name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Build Xcode Archive
        run: |
          build() {
            xcodebuild archive \
              -project Folium.xcodeproj \
              -scheme Folium \
              -configuration Release \
              -archivePath "$PWD/build/Folium.xcarchive" \
              -destination 'generic/platform=iOS' \
              -skipMacroValidation \
              -skipPackagePluginValidation \
              GCC_TREAT_WARNINGS_AS_ERRORS=NO \
              SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" 2>&1 | tee build.log
            return ${PIPESTATUS[0]}
          }

          if ! build; then
            if grep -q "future Xcode project file format" build.log; then
              sed -i '' 's/objectVersion = 110;/objectVersion = 77;/' Folium.xcodeproj/project.pbxproj
              build
            else
              exit 1
            fi
          fi

      - name: Show build errors
        if: failure()
        run: grep -n "error:" build.log | head -30

      - name: Package IPA
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Folium.xcarchive/Products/Applications/*.app Payload/
          zip -r -y Folium.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Folium-Unsigned-IPA
          path: Folium.ipa


      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Folium-Unsigned-IPA
          path: Folium.ipa

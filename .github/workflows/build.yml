name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Install build dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          for pkg in boost vulkan-headers spirv-headers vulkan-memory-allocator robin-map glslang fmt; do
            brew install "$pkg" || echo "Could not install $pkg, continuing"
          done
          PREFIX="$(brew --prefix)"
          ls "$PREFIX/include/boost/fusion/include/adapt_struct.hpp"
          ls "$PREFIX/include/vulkan/vulkan.hpp"
          VMA="$(find "$PREFIX/include" "$PREFIX/Cellar/vulkan-memory-allocator" -name vk_mem_alloc.h 2>/dev/null | head -1 || true)"
          if [ -z "$VMA" ]; then
            mkdir -p "$PWD/extra-include"
            curl -fsSL -o "$PWD/extra-include/vk_mem_alloc.h" https://raw.githubusercontent.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator/master/include/vk_mem_alloc.h
            VMA="$PWD/extra-include/vk_mem_alloc.h"
          fi
          echo "Using VMA header at: $VMA"
          echo "VMA_DIR=$(dirname "$VMA")" >> "$GITHUB_ENV"

      - name: Build Xcode Archive
        run: |
          defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES
          BREW_INCLUDE="$(brew --prefix)/include"
          build() {
            xcodebuild archive \
              -project Folium.xcodeproj \
              -scheme Folium \
              -configuration Release \
              -archivePath "$PWD/build/Folium.xcarchive" \
              -destination 'generic/platform=iOS' \
              -skipMacroValidation \
              -skipPackagePluginValidation \
              HEADER_SEARCH_PATHS='$(inherited) '"$BREW_INCLUDE $VMA_DIR" \
              GCC_TREAT_WARNINGS_AS_ERRORS=NO \
              SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" 2>&1 | tee build.log
            return ${PIPESTATUS[0]}
          }

          if ! build; then
            if grep -q "future Xcode project file format" build.log; then
              sed -i '' 's/objectVersion = 110;/objectVersion = 77;/' Folium.xcodeproj/project.pbxproj
              build
            else
              exit 1
            fi
          fi

      - name: Show all build errors
        if: failure()
        run: |
          grep -E "error:|ld: |Undefined symbols" build.log \
            | grep -vE "^[[:space:]]*[0-9]+ \|" \
            | sed -E 's#^.*/([^/]+:[0-9]+:[0-9]+: )#\1#' \
            | sort -u | head -60

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Package IPA
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Folium.xcarchive/Products/Applications/*.app Payload/
          zip -r -y Folium.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Folium-Unsigned-IPA
          path: Folium.ipa
